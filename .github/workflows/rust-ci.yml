name: Linux dependency proof

on:
  workflow_dispatch:

permissions:
  contents: read

run-name: "Linux dependency proof for PR 198 at ${{ github.sha }}"

jobs:
  linux-dependency-proof:
    name: Linux consumer compile and focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE_SHA: 540bbabc1cbf0a20d4cf4bc790c0ae5b257e4731
      EXPECTED_PROOF_BRANCH: proof/linux-dependency-validation-20261017
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify proof ref and PR source parity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_PROOF_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_SHA"
          changed_files="$(git diff --name-only "$EXPECTED_SOURCE_SHA" HEAD)"
          test "$changed_files" = ".github/workflows/rust-ci.yml"
          echo "Proof commit: $(git rev-parse HEAD)"
          echo "Product source: $EXPECTED_SOURCE_SHA (identical to PR #198)"
          echo "Only changed file: $changed_files"

      - uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Check Linux keyring, RMCP, and TUI consumers
        working-directory: codex-rs
        run: cargo check -p codex-keyring-store -p codex-rmcp-client -p codex-tui

      - name: Test Linux keyring typed error classification
        working-directory: codex-rs
        run: just test -p codex-keyring-store preserves_typed_causes_without_guessing_from_messages

      - name: Test TUI motion behavior
        working-directory: codex-rs
        run: just test -p codex-tui motion::tests
